version: 2.1
parameters:
  node-version:
    type: string
    default: "24.10.0"
orbs:
  node: circleci/node@5.0.0
  slack: circleci/slack@4.5.3
commands:
  notify_on_failure:
    steps:
      - slack/notify:
          event: fail
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": ":red_circle: *$CIRCLE_PROJECT_REPONAME*:*$CIRCLE_TAG* build failed"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }
  notify_on_pass:
    steps:
      - slack/notify:
          event: pass
          custom: |
            {
              "blocks": [
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": ":tada: *$CIRCLE_PROJECT_REPONAME*:*$CIRCLE_TAG* was successfully built and published"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Job"
                      },
                      "url": "${CIRCLE_BUILD_URL}"
                    }
                  ]
                }
              ]
            }
jobs:
  test:
    docker:
      - image: cimg/node:24.10.0
    steps:
      - checkout
      - node/install:
          node-version: << pipeline.parameters.node-version >>
      - node/install-packages:
          cache-path: ./node_modules
          override-ci-command: npm install
      - run:
          name: Audit Dependencies
          command: npm run audit
      - run:
          name: test
          command: npm test
  build:
    docker:
      - image: cimg/node:24.10.0
        user: root
    steps:
      - checkout
      - node/install:
          node-version: << pipeline.parameters.node-version >>
      - setup_remote_docker:
          version: default
          docker_layer_caching: true
      # build and push Docker image
      - run:
          name: Debug - Show tag and environment
          command: |
            echo "Tag: $CIRCLE_TAG"
            echo "Repository: $CIRCLE_PROJECT_REPONAME"
            echo "Build URL: $CIRCLE_BUILD_URL"
      - run:
          name: Install component-build-helper lib
          command: |
            npm install -g @elastic.io/component-build-helper
            echo "Installed version:"
            npm list -g @elastic.io/component-build-helper 2>&1 || echo "Version check failed"
            echo "---"
            echo "Checking build_component_docker help/options:"
            build_component_docker --help 2>&1 || build_component_docker -h 2>&1 || echo "No help available"
      - run:
          name: Build and publish docker image
          command: |
            set -e
            echo "Environment check:"
            echo "CIRCLE_TAG: $CIRCLE_TAG"
            echo "CIRCLE_PROJECT_REPONAME: $CIRCLE_PROJECT_REPONAME"
            echo "CIRCLE_BRANCH: $CIRCLE_BRANCH"
            echo "DRY_RUN: ${DRY_RUN:-not set}"
            echo "DOCKER_USERNAME: ${DOCKER_USERNAME:-not set}"
            echo "All environment variables containing 'DRY' or 'PUSH':"
            env | grep -iE 'DRY|PUSH' || echo "None found"
            echo "---"
            echo "Package.json info:"
            cat package.json | grep -E '"name"|"repository"' || echo "Could not read package.json"
            echo "---"
            echo "Component.json version:"
            cat component.json | grep '"version"' || echo "Could not read component.json"
            echo "---"
            echo "Running build_component_docker with verbose output..."
            echo "Ensuring DRY_RUN is disabled for push..."
            unset DRY_RUN
            echo "DRY_RUN after unset: ${DRY_RUN:-unset/empty (good)}"
            build_component_docker 2>&1 | tee /tmp/build_output.log
            EXIT_CODE=$?
            echo "build_component_docker exited with code: $EXIT_CODE"
            echo "---"
            echo "Checking local Docker images..."
            docker images elasticio/code-component || echo "No images found"
            echo "---"
            echo "Checking all Docker images with 'code' in name..."
            docker images | grep code || echo "No code images found"
            echo "---"
            echo "Checking if image was pushed to Docker Hub..."
            docker manifest inspect elasticio/code-component:$CIRCLE_TAG 2>&1 && echo "✓ Image found on Docker Hub!" || echo "✗ Image NOT found on Docker Hub"
            echo "---"
            echo "Checking build_component_docker output for push messages..."
            if [ -f /tmp/build_output.log ]; then
              grep -i "push\|publish\|upload" /tmp/build_output.log || echo "No push-related messages found in output"
            fi
      - notify_on_failure
      - notify_on_pass
workflows:
  test:
    jobs:
      - test:
          name: "Running tests"
          filters:
            tags:
              ignore: /.*/
  publish_release:
    jobs:
      - build:
          name: "Build and publish docker image"
          context:
            - componentspusher
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^([0-9]+)\.([0-9]+)\.([0-9]+)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+)?$/
